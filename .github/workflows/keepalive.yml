name: Keep Supabase awake

# مشروع Supabase المجاني يتوقف بعد 7 أيام بلا طلبات لقاعدة البيانات؛ هذا يرسل طلب قراءة خفيفًا كل 3 أيام (مفتاح anon العام فقط، والـ RLS يرجع صفرًا)
on:
  schedule:
    - cron: "17 4 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: طلب إلى قاعدة البيانات
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.js | head -1)
          KEY=$(grep -oE 'eyJ[A-Za-z0-9._-]+|sb_publishable_[A-Za-z0-9_-]+' config.js | head -1)
          test -n "$URL" -a -n "$KEY" || { echo "::error::تعذر قراءة العنوان أو المفتاح من config.js"; exit 1; }
          code=$(curl -s -o /tmp/out -w '%{http_code}' -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/tenants?select=id&limit=1")
          echo "HTTP $code"; head -c 200 /tmp/out; echo
          test "$code" = "200" || { echo "::error::القاعدة لم تستجب (قد يكون المشروع متوقفًا — أعد تشغيله من لوحة Supabase)"; exit 1; }
